name: Publish to Mooncakes

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install Node.js for JavaScript tests
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Validate package
        run: |
          moon version --all
          moon update
          moon fmt --check
          moon check --target all --deny-warn
          moon test --target all --deny-warn
          moon info
          git diff --exit-code

      - name: Configure Mooncakes credentials
        env:
          MOONCAKES_TOKEN: ${{ secrets.MOONCAKES_TOKEN }}
        shell: bash
        run: |
          mkdir -p "$HOME/.moon"
          node -e 'const fs = require("fs"); fs.writeFileSync(process.env.HOME + "/.moon/credentials.json", JSON.stringify({ username: "qyt1234567", token: process.env.MOONCAKES_TOKEN }) + "\n")'

      - name: Publish
        env:
          MOONCAKES_TOKEN: ${{ secrets.MOONCAKES_TOKEN }}
        run: moon publish --frozen
