name: Check and Test

on:
  pull_request:
  push:
    branches:
      - $default-branch

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install MoonBit (Unix)
        if: ${{ matrix.os != 'windows-latest' }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Install MoonBit (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$HOME/.moon/bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Toolchain
        run: moon version --all
      - name: Format
        run: moon fmt --check
      - name: Check all targets
        run: moon check --target all --deny-warn
      - name: Test all targets
        run: moon test --target all --deny-warn
      - name: Verify generated interfaces
        shell: bash
        run: |
          moon info
          git diff --exit-code
