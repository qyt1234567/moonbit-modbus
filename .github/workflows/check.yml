name: Check and Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install MoonBit (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install MoonBit (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          [IO.Path]::Combine($HOME, '.moon', 'bin') | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Toolchain
        run: |
          moon version --all
          moon update

      - name: Install Node.js for JavaScript tests
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Format
        run: moon fmt --check

      - name: Check all targets
        run: moon check --target all --deny-warn

      - name: Build all targets
        run: moon build --target all

      - name: Test all targets
        run: moon test --target all --deny-warn

      - name: CLI smoke test
        run: moon run --target native cmd/main

      - name: Verify generated interfaces
        shell: bash
        run: |
          moon info
          git diff --exit-code
